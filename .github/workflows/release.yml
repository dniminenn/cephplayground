name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build linux binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build \
              -trimpath \
              -ldflags="-s -w -X github.com/dniminenn/cephplayground/internal/adm.Version=${GITHUB_REF_NAME}" \
              -o dist/cephplayground-linux-$arch ./cmd/cephplayground
          done
          cd dist && sha256sum cephplayground-linux-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cephplayground-linux-amd64
            dist/cephplayground-linux-arm64
            dist/SHA256SUMS
          generate_release_notes: true
